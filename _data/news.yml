- date: August 2025
  headline: "Josh Schraiber's paper on DR EVIL, a new approach for estimating demographic history using rare variants in extremely large datasets is published at AJHG. Congratulations, Josh!"

- date: May 2025
  headline: "Feriel Ouerghi's paper on forensic likelihood ratios from sequencing reads is accepted at FSI Genetics. Congratulations, Feriel!"

- date: April 2025
  headline: "Sanjana Paye's paper on the implications of mathematical bounds on r^2 for case-control GWAS is accepted at Theoretical Population Biology. Congratulations, Sanjana!"

- date: April 2025
  headline: "Feriel Ouerghi, Obadiah Mulder, Dandan Peng, and Janis Liu all completed their qualifying exams this month. Congratulations to all our students, and thanks to their faculty committees."

- date: Mar 2025
  headline: "Our collaborative paper (led by Charleston Chiang's lab) on an ARG-based likelihood for demographic inference is accepted at Nature Genetics."

- date: Feb 2025
  headline: "Janis Liu's paper on Qst-Fst comparisons is accepted at Genetics. Congratulations, Janis!"
  
- date: Feb 2025
  headline: "Dandan Peng and Obadiah Mulder's paper on the performance of ARG estimation software in tracing the history of population-mean polygenic scores is accepted at Genetics. Congratulations, Dandan and Obadiah!"
  
- date: Oct 2024
  headline: "Josh Schraiber's paper unifying methods in statistical genetics and phylogenetics is published in PLoS Biology. Congratulations, Josh!"

- date: Aug 2024
  headline: "Roshni Patel has joined the lab as a postdoc. Welcome, Roshni!"

- date: July 2024
  headline: "Vivian Link has finished her postdoctoral position and will join Cardio-CARE Davos as a bioinformatician. Congratulations, Vivian, and we'll miss you!"

- date: Mar 2024
  headline: "Josh Schraiber's paper examining the notion of between-group heritability and related ideas is now published in PNAS. Congratulations, Josh!"

- date: Dec 2023
  headline: "Vivian Link's paper proposing a tree-based method for identifying quantitative-trait loci is now published in the American Journal of Human Genetics. Congratulations, Vivian!"

- date: Oct 2023
  headline: "Vivian Link's paper on trait-associated genetic variants in the neighborhood of forensic-genetic loci is now published in iScience. Congratulations, Vivian!"

- date: July 2023
  headline: "Tina Lasisi and Sanjana Paye have left Los Angeles for the University of Michigan, where Tina will be an assistant professor of anthropology and Sanjana will be an MD/PhD student. Congratulations, and we will miss you both!"

- date: May 2023
  headline: "Feriel Ouerghi has joined the lab as a PhD student. Welcome, Feriel!"

- date: January 2023
  headline: "Josh Schraiber has joined the lab as a research scientist. Welcome, Josh!"

- date: December 2022
  headline: "Our new article with Brandon Ogbunu celebrating the 25th anniversary of Gattaca was published as a perspective in the December issue of GENETICS, and appears on the cover."

- date: October 2022
  headline: "Science News selected postdoc Tina Lasisi as part of the 2022 cohort of SN10: 10 Scientists to Watch. She also won the Jon C. Graff Prize for Excellence in Science Communication, awarded annually to one scientist in that year's SN10. Congratulations, Tina!"

- date: August 2022
  headline: "Tina Lasisi has joined the lab as a postdoc. Welcome, Tina!"

- date: June 2022
  headline: "A special issue of Philosophical Transactions of the Royal Society B celebrates 50 years since Lewontin's apportionment of human genetic diversity."

- date: May 2022
  headline: "Janis Liu has joined the lab as a PhD student. Welcome, Janis!"

- date: February 2022
  headline: "A new commentary in Trends in Genetics considers the relationship between open practices in science and courtroom procedure."

- date: August 2021
  headline: "Obadiah Mulder and Dandan Peng have joined the lab as PhD students. Welcome, Obadiah and Dandan!"

- date: July 2021
  headline: "We have a new commentary in PNAS with Arbel Harpak, celebrating some great work by Yuchang Wu and colleagues on estimating indirect genetic effects."

- date: May 2021
  headline: "Vivian Link has joined the lab as a postdoc. Welcome, Vivian!"

- date: March 2021
  headline: "A new piece in the American Journal of Physical Anthropology explores a model of how genealogical ancestry and phenotype become decoupled over time in admixed populations. Work led by Jaehee Kim and joint with Amy Goldberg and Noah Rosenberg."

- date: Jan 2021
  headline: "Happy new year! CBB graduate students Obadiah Mulder, Dandan Peng, and Jia Yang will rotate with us for the Spring semester, and USC undergraduates Judy Wang and Sanjana Paye have joined the lab."

- date: Dec 2020
  headline: "Vivian Link will join us as a postdoc starting in April 2021."
  
- date: Sept 2020
  headline: "The lab is NIH-funded! We received an NIGMS R35 MIRA that will fund our research for the next five years."

- date: Aug 2020
  headline: "Linda Ding joins the Edge lab as a graduate student."
  
- date: Aug 2020
  headline: "The Edge lab is officially open (remotely)."
  


  
